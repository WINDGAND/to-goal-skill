<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">to-goal-skill 工作流</title>
  <desc id="desc">澄清 → 匹配 → 计划 → 批准 → 执行 → 验收</desc>
  <rect width="1200" height="280" fill="#F4F3EF"/>
  <rect x="0" y="0" width="1200" height="280" fill="none" stroke="#D8D4CB" stroke-width="1"/>
  <rect x="0" y="0" width="1200" height="4" fill="#141414"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="48" y="36" fill="#6B6760" font-size="11" letter-spacing="3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HOW IT WORKS</text>
    <text x="48" y="74" fill="#141414" font-size="30" font-weight="700">先批准，再动手</text>
    <text x="48" y="108" fill="#6B6760" font-size="16">用证据说完成，不靠感觉</text>

    <line x1="48" y1="190" x2="1152" y2="190" stroke="#D8D4CB" stroke-width="1"/>
      <line x1="80" y1="182" x2="80" y2="198" stroke="#141414" stroke-width="1.5"/>
      <text x="74" y="162" fill="#9A958C" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">01</text>
      <text x="74" y="228" fill="#141414" font-size="18" font-weight="600">澄清</text>
      <line x1="230" y1="182" x2="230" y2="198" stroke="#141414" stroke-width="1.5"/>
      <text x="224" y="162" fill="#9A958C" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">02</text>
      <text x="224" y="228" fill="#141414" font-size="18" font-weight="600">匹配</text>
      <line x1="380" y1="182" x2="380" y2="198" stroke="#141414" stroke-width="1.5"/>
      <text x="374" y="162" fill="#9A958C" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03</text>
      <text x="374" y="228" fill="#141414" font-size="18" font-weight="600">计划</text>
      <line x1="720" y1="182" x2="720" y2="198" stroke="#141414" stroke-width="1.5"/>
      <text x="714" y="162" fill="#9A958C" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">04</text>
      <text x="714" y="228" fill="#141414" font-size="18" font-weight="600">执行</text>
      <line x1="920" y1="182" x2="920" y2="198" stroke="#141414" stroke-width="1.5"/>
      <text x="914" y="162" fill="#9A958C" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">05</text>
      <text x="914" y="228" fill="#141414" font-size="18" font-weight="600">验收</text>

    <g id="gate">
      <rect x="516" y="146" width="88" height="88" fill="#B42318"/>
      <rect x="521" y="151" width="78" height="78" fill="none" stroke="#FFFFFF" stroke-width="1"/>
      <text x="560" y="186" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">批准</text>
      <text x="560" y="208" text-anchor="middle" fill="#FFFFFF" font-size="10" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GATE</text>
    </g>

    <text x="48" y="258" fill="#6B6760" font-size="13">缺口 → 回到匹配 · 最多 2 轮</text>
  </g>
</svg>
